<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fade Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#2440f0;font-family:'Work Sans',system-ui,sans-serif}
a{color:inherit}
a:focus-visible,.chip:focus-visible,.go:focus-visible{outline:3px solid #f5a300;outline-offset:2px}
.m{display:block}
.m2{background:#2440f0;color:#f2f2ee;font-family:'DM Sans',sans-serif}
.m2 .in{max-width:1040px;margin:0 auto;padding:0 20px}
.m2 nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-weight:500}
.m2 nav span{background:#ffd23f;color:#0a0f3c;padding:8px 14px;border-radius:99px;font-size:14px}
.m2 h1{font:400 clamp(84px,25vw,270px)/.82 'Anton',sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:24px 0 8px}
.m2 .strip{background:#ffd23f;color:#0a0f3c;font:400 22px 'Anton',sans-serif;text-transform:uppercase;padding:12px 0;letter-spacing:.04em;transform:rotate(-1.5deg);margin:24px -20px;text-align:center}
.m2 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;padding:28px 0 56px}
.m2 h2{font:400 34px 'Anton',sans-serif;text-transform:uppercase;margin-bottom:14px}
.m2 .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.m2 .chip{padding:11px 16px;border:2px solid #f2f2ee;border-radius:99px;background:transparent;color:#f2f2ee;font:500 15px 'DM Sans',sans-serif;cursor:pointer}
.m2 .chip[aria-pressed=true]{background:#f2f2ee;color:#0a0f3c}
.m2 .panel{background:#0a0f3c;padding:24px;border-radius:14px}
.m2 .panel p{font-size:15px;margin-bottom:12px;color:#c9cffc}
.m2 .go{width:100%;margin-top:6px;padding:16px;border:0;border-radius:10px;background:#ffd23f;color:#0a0f3c;font:700 17px 'DM Sans',sans-serif;cursor:pointer}
.m2 .sum{font-size:15px;margin-top:14px;min-height:22px}
.m2 .team{display:flex;flex-direction:column;gap:12px;font-size:18px}
.m2 .team div{display:flex;justify-content:space-between;border-bottom:2px solid #f2f2ee55;padding-bottom:10px}

</style>
</head>
<body>
<main class="m m2">
  <div class="in">
    <nav><b>@fadelab</b><span>Vagas hoje: 4</span></nav>
    <h1>Fade<br>Lab</h1>
  </div>
  <div class="strip" aria-hidden="true">Degradê • Platinado • Barba • Sobrancelha • Pigmentação</div>
  <div class="in">
    <div class="grid">
      <section class="panel">
        <h2>Agende em 30 segundos</h2>
        <p>1. Escolha o serviço</p>
        <div class="chips" id="svc">
          <button class="chip" aria-pressed="false" data-n="Degradê" data-p="50">Degradê · R$ 50</button>
          <button class="chip" aria-pressed="false" data-n="Barba" data-p="35">Barba · R$ 35</button>
          <button class="chip" aria-pressed="false" data-n="Platinado" data-p="180">Platinado · R$ 180</button>
        </div>
        <p>2. Escolha o horário</p>
        <div class="chips" id="hr">
          <button class="chip" aria-pressed="false" data-n="14h">14h</button>
          <button class="chip" aria-pressed="false" data-n="15h30">15h30</button>
          <button class="chip" aria-pressed="false" data-n="17h">17h</button>
          <button class="chip" aria-pressed="false" data-n="18h30">18h30</button>
        </div>
        <button class="go" id="go">Confirmar horário</button>
        <div class="sum" id="sum" aria-live="polite"></div>
      </section>
      <section>
        <h2>Quem corta</h2>
        <div class="team">
          <div><span>Diego</span><span>degradê e platinado</span></div>
          <div><span>Kauê</span><span>barba e desenho</span></div>
          <div><span>Rafa</span><span>infantil e social</span></div>
        </div>
        <p style="margin-top:28px;font-size:15px;color:#c9cffc">Av. Central, 1020, sala 3 · Seg a sáb, 10h às 20h</p>
      </section>
    </div>
  </div>
</main>
<script>(function(){
  function single(id){var g=document.getElementById(id);g.addEventListener('click',function(e){
    var c=e.target.closest('.chip');if(!c)return;
    g.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===c)});
    document.getElementById('sum').textContent='';
  })}
  single('svc');single('hr');
  document.getElementById('go').addEventListener('click',function(){
    var s=document.querySelector('#svc [aria-pressed=true]'),h=document.querySelector('#hr [aria-pressed=true]'),o=document.getElementById('sum');
    o.textContent=(s&&h)?'Confirmado: '+s.dataset.n+' às '+h.dataset.n+' (R$ '+s.dataset.p+').':'Escolha um serviço e um horário.';
  });
})();</script>
</body>
</html>
